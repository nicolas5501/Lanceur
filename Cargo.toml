[package]
name = "lanceur"
version = "0.2.0"
edition = "2024"

[dependencies]
# Slint avec renderer logiciel pur : RAM minimale (~3 à 6 Mo)
slint = { version = "1.17", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.3"
rfd = "0.15"
mimalloc = { version = "0.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_System_Ole",
]

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true


