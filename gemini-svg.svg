<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Fond principal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0f0f12" />
    </linearGradient>

    <!-- Volet translucide qui descend -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Barre d'ancrage supérieure -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Fond arrondi de l'icône -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Volet déroulant semi-transparent -->
  <path d="M 44 48 L 212 48 C 212 48, 212 168, 212 168 C 212 180, 200 190, 188 190 L 68 190 C 56 190, 44 180, 44 168 Z" fill="url(#panelGrad)" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Bandeau supérieur d'ancrage -->
  <rect x="40" y="44" width="176" height="20" rx="10" fill="url(#barGrad)" />

  <!-- 3 Conteneurs d'icônes miniatures dans le bandeau -->
  <rect x="60" y="88" width="36" height="36" rx="8" fill="#38bdf8" fill-opacity="0.9" />
  <rect x="110" y="88" width="36" height="36" rx="8" fill="#818cf8" fill-opacity="0.9" />
  <rect x="160" y="88" width="36" height="36" rx="8" fill="#c084fc" fill-opacity="0.9" />

  <!-- Ligne de séparation subtile -->
  <line x1="60" y1="144" x2="196" y2="144" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />

  <!-- Chevron d'ouverture vers le bas -->
  <path d="M 120 162 L 128 170 L 136 162" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
